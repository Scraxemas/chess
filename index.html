<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>Chess</h1>
        <div class="actions">
          <button type="button" id="btn-new">New Game</button>
          <button type="button" id="btn-undo">Undo</button>
        </div>
      </header>
      <div class="mode-bar">
        <label class="mode-field">
          Mode
          <select id="mode-select" aria-label="Play mode">
            <option value="local">Local 2-player</option>
            <option value="ai">Play vs AI</option>
          </select>
        </label>
        <label class="mode-field">
          Theme
          <select id="theme-select" aria-label="Board theme">
            <option value="classic">Classic</option>
            <option value="pokemon">Pokémon</option>
          </select>
        </label>
        <label class="mode-field" id="color-label" hidden>
          You play
          <select id="color-select" aria-label="Your color">
            <option value="w" selected>White</option>
            <option value="b">Black</option>
          </select>
        </label>
        <label class="mode-field" id="difficulty-label" hidden>
          Difficulty
          <select id="difficulty-select" aria-label="AI difficulty">
            <option value="weak" selected>Weak</option>
            <option value="master">Master</option>
          </select>
        </label>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <div id="board-wrap" class="board-wrap"></div>
      <aside class="history-panel">
        <h2>Moves</h2>
        <ol id="history" class="history"></ol>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
